<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Odoo Signature Background -->
  <rect width="64" height="64" rx="14" fill="#714B67"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="#906584" stroke-width="1.5"/>

  <!-- The Royal Knot Heraldic Interlocking Monogram -->
  <g stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Interlocking Loop -->
    <path d="M26 20 C18 20 13 25.5 13 32 C13 38.5 18 44 26 44 C33 44 38 38 41 32 C38 26 33 20 26 20 Z" fill="none" opacity="0.95"/>
    <!-- Right Interlocking Loop -->
    <path d="M38 20 C46 20 51 25.5 51 32 C51 38.5 46 44 38 44 C31 44 26 38 23 32 C26 26 31 20 38 20 Z" fill="none" stroke="#FDE68A"/>
  </g>

  <!-- Crown / Royal Crest Finial -->
  <path d="M26 15 L32 11 L38 15 L35 17 L29 17 Z" fill="#FDE68A"/>
  <circle cx="32" cy="10" r="1.5" fill="#FFFFFF"/>
  <circle cx="26" cy="14" r="1" fill="#FFFFFF"/>
  <circle cx="38" cy="14" r="1" fill="#FFFFFF"/>

  <!-- Center Diamond Lock -->
  <path d="M32 29 L35 32 L32 35 L29 32 Z" fill="#FFFFFF"/>
</svg>
